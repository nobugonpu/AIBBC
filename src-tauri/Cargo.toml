[package]
name = "aibbc"
version = "0.1.0"
description = "RI Treatment Scheduling Desktop App"
authors = []
license = ""
repository = ""
default-run = "aibbc"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aibbc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aibbc"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
