[package]
name = "aibbc"
version = "0.1.0"
description = "RI Treatment Scheduling Desktop App"
authors = []
license = ""
repository = ""
default-run = "aibbc"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aibbc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aibbc"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite + SQLCipher (statically bundled, no OS-level OpenSSL required)
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# Cryptography
ring = "0.17"            # PBKDF2-HMAC-SHA256 for key derivation
aes-gcm = "0.10"         # AES-256-GCM for per-file media encryption
rand = "0.8"             # CSPRNG for salts / IVs
zeroize = { version = "1", features = ["derive"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
hex = "0.4"
rfd = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
